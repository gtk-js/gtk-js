name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/gtk-rs/gtk4-rs/gtk4:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install needed dependencies
        run: dnf install -y sassc unzip cargo libxml2-devel pcre2-devel fribidi-devel

      # The image has GTK and libadwaita; the native cases need GtkSourceView
      # too, built from its submodule like they're built from theirs.
      - name: Build GtkSourceView
        run: |
          meson setup /tmp/gtksourceview upstream/gtksourceview --prefix=/usr --buildtype=release \
            -Dintrospection=disabled -Dvapi=false -Dbuild-testsuite=false -Ddocumentation=false
          meson install -C /tmp/gtksourceview

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          run-install: false

      - name: Install dependencies
        run: vp install
        env:
          HOME: /root

      - name: Build packages
        run: vp run build:packages

      - name: Run tests
        run: vp test --reporter=default --reporter=junit --outputFile.junit=test-results.xml
        env:
          HOME: /root

      - name: Fix git ownership for test reporter
        if: ${{ !cancelled() }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
